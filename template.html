<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$ja$endif$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>$if(title)$$title$$else$文書$endif$</title>
  $if(description)$<meta name="description" content="$description$">$endif$

  <style>
    /* デジタル庁デザインシステムを参考にした基本色・余白・文字組み */
    :root {
      color-scheme: light;
      --color-text: #1a1a1a;
      --color-text-subtle: #626264;
      --color-background: #ffffff;
      --color-background-subtle: #f5f5f5;
      --color-border: #949497;
      --color-border-light: #d8d8db;
      --color-link: #0017c1;
      --color-link-hover: #000082;
      --color-link-visited: #000082;
      --color-focus: #ffd43d;
      --color-current: #e8f1fe;
      --sidebar-width: 25rem;
      --content-width: 52rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --color-text: #f2f2f2;
        --color-text-subtle: #c8c8cb;
        --color-background: #121212;
        --color-background-subtle: #202020;
        --color-border: #949497;
        --color-border-light: #46464a;
        --color-link: #9db7ff;
        --color-link-hover: #c7d4ff;
        --color-link-visited: #c7b5ff;
        --color-focus: #ffd43d;
        --color-current: #263451;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 1.5rem;
    }

    body {
      margin: 0;
      color: var(--color-text);
      background: var(--color-background);
      font-family: sans-serif;
      font-size: 1rem;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    a {
      color: var(--color-link);
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    a:visited {
      color: var(--color-link-visited);
    }

    a:hover {
      color: var(--color-link-hover);
      text-decoration-thickness: 0.18em;
    }

    :focus-visible {
      outline: 3px solid var(--color-focus);
      outline-offset: 3px;
    }

    .skip-link {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      z-index: 100;
      padding: 0.75rem 1rem;
      color: #ffffff;
      background: #000000;
      transform: translateY(-150%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(16rem, var(--sidebar-width)) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 2rem 1.5rem;
      overflow-y: auto;
      background: var(--color-background-subtle);
      border-right: 1px solid var(--color-border-light);
    }

    .sidebar-title {
      margin: 0 0 1rem;
      font-size: 1.25rem;
      line-height: 1.4;
    }

    .outline-status {
      margin: 0;
      color: var(--color-text-subtle);
    }

    .outline,
    .outline ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .outline ol {
      margin-left: 0.75rem;
      padding-left: 0.75rem;
      border-left: 1px solid var(--color-border-light);
    }

    .outline li {
      margin: 0.25rem 0;
    }

    .outline-row {
      display: flex;
      align-items: flex-start;
      gap: 0.25rem;
      min-width: 0;
    }

    .outline a {
      display: block;
      flex: 1;
      min-width: 0;
      padding: 0.38rem 0.5rem;
      color: var(--color-text);
      border-radius: 0.25rem;
      text-decoration: none;
      line-height: 1.5;
    }

    .outline a:hover {
      color: var(--color-link-hover);
      background: var(--color-background);
      text-decoration: underline;
    }

    .outline a[aria-current="location"] {
      color: var(--color-link);
      background: var(--color-current);
      font-weight: 700;
    }

    .outline-toggle {
      flex: 0 0 2rem;
      width: 2rem;
      height: 2rem;
      padding: 0;
      color: var(--color-text);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 0.25rem;
      cursor: pointer;
      font: inherit;
      line-height: 1;
    }

    .outline-toggle:hover {
      background: var(--color-background);
      border-color: var(--color-border);
    }

    .outline-toggle::before {
      content: "−";
      font-weight: 700;
    }

    .outline-toggle[aria-expanded="false"]::before {
      content: "+";
    }

    .outline-spacer {
      flex: 0 0 2rem;
      width: 2rem;
    }

    .content-area {
      min-width: 0;
      padding: 3rem clamp(1.5rem, 5vw, 5rem) 6rem;
    }

    .document {
      width: min(100%, var(--content-width));
      margin: 0 auto;
    }

    .document-header {
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--color-text);
    }

    .document-header h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.3;
      letter-spacing: 0.01em;
    }

    .document-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      margin: 1rem 0 0;
      color: var(--color-text-subtle);
    }

    main h1,
    main h2,
    main h3,
    main h4,
    main h5,
    main h6 {
      line-height: 1.4;
      scroll-margin-top: 1.5rem;
    }

    main h1 {
      margin: 3.5rem 0 1rem;
      padding-bottom: 0.5rem;
      font-size: 2rem;
      border-bottom: 2px solid var(--color-text);
    }

    main h2 {
      margin: 3rem 0 1rem;
      padding: 0.25rem 0 0.5rem 0.875rem;
      font-size: 1.75rem;
      border-bottom: 1px solid var(--color-border);
      border-left: 0.375rem solid var(--color-link);
    }

    main h3 {
      margin: 2.5rem 0 0.75rem;
      font-size: 1.5rem;
    }

    main h4 {
      margin: 2rem 0 0.75rem;
      font-size: 1.25rem;
    }

    main h5,
    main h6 {
      margin: 1.75rem 0 0.5rem;
      font-size: 1.125rem;
    }

    p,
    ul,
    ol,
    blockquote,
    pre,
    table {
      margin-top: 1rem;
      margin-bottom: 1rem;
    }

    ul,
    ol {
      padding-left: 2em;
    }

    li + li {
      margin-top: 0.35rem;
    }

    blockquote {
      margin-left: 0;
      margin-right: 0;
      padding: 0.1rem 1rem;
      color: var(--color-text-subtle);
      background: var(--color-background-subtle);
      border-left: 0.375rem solid var(--color-border);
    }

    code,
    pre {
      font-family: sans-serif;
    }

    code {
      padding: 0.1em 0.35em;
      background: var(--color-background-subtle);
      border: 1px solid var(--color-border-light);
      border-radius: 0.25rem;
    }

    pre {
      padding: 1rem;
      overflow-x: auto;
      background: var(--color-background-subtle);
      border: 1px solid var(--color-border-light);
      border-radius: 0.5rem;
      line-height: 1.6;
    }

    pre code {
      padding: 0;
      background: transparent;
      border: 0;
    }

    table {
      display: block;
      width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 0.75rem;
      text-align: left;
      vertical-align: top;
      border: 1px solid var(--color-border);
    }

    th {
      background: var(--color-background-subtle);
      font-weight: 700;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    hr {
      margin: 3rem 0;
      border: 0;
      border-top: 1px solid var(--color-border);
    }

    .mobile-outline-button {
      display: none;
    }

    @media (max-width: 60rem) {
      .layout {
        display: block;
      }

      .sidebar {
        position: static;
        width: auto;
        height: auto;
        padding: 1rem;
        border-right: 0;
        border-bottom: 1px solid var(--color-border-light);
      }

      .mobile-outline-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 2.75rem;
        padding: 0.5rem 0.75rem;
        color: var(--color-text);
        background: var(--color-background);
        border: 1px solid var(--color-border);
        border-radius: 0.25rem;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .mobile-outline-button::after {
        content: "−";
      }

      .mobile-outline-button[aria-expanded="false"]::after {
        content: "+";
      }

      .sidebar-title {
        display: none;
      }

      .outline {
        margin-top: 0.75rem;
        max-height: 50vh;
        overflow-y: auto;
      }

      .content-area {
        padding-top: 2rem;
      }
    }

    @media print {
      .skip-link,
      .sidebar {
        display: none;
      }

      .layout {
        display: block;
      }

      .content-area {
        padding: 0;
      }

      .document {
        width: 100%;
        max-width: none;
      }

      a {
        color: inherit;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>

  <div class="layout">
    <aside class="sidebar" aria-label="文書アウトライン">
      <button
        id="mobile-outline-button"
        class="mobile-outline-button"
        type="button"
        aria-expanded="true"
        aria-controls="document-outline"
      >アウトライン</button>
      <h2 class="sidebar-title">アウトライン</h2>
      <nav id="document-outline" class="outline" aria-label="見出し一覧">
        <p class="outline-status">見出しを読み込んでいます。</p>
      </nav>
    </aside>

    <div class="content-area">
      <article class="document">
        $if(title)$
        <header class="document-header">
          <h1>$title$</h1>
          $if(subtitle)$<p>$subtitle$</p>$endif$
          $if(author)$
          <p class="document-meta"><span>作成者：$for(author)$$author$$sep$、$endfor$</span>$if(date)$<span>日付：$date$</span>$endif$</p>
          $elseif(date)$
          <p class="document-meta"><span>日付：$date$</span></p>
          $endif$
        </header>
        $endif$

        <main id="main-content" tabindex="-1">
          $body$
        </main>
      </article>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const root = document.getElementById("main-content");
      const outline = document.getElementById("document-outline");
      const mobileButton = document.getElementById("mobile-outline-button");
      const headings = Array.from(root.querySelectorAll("h1, h2, h3, h4, h5, h6"));
      const usedIds = new Set(Array.from(document.querySelectorAll("[id]")).map((element) => element.id));

      // 見出しにIDがない場合は、見出し文字列から重複しないIDを生成する。
      const createUniqueId = (heading, index) => {
        const base = heading.textContent
          .trim()
          .toLowerCase()
          .replace(/[\s　]+/g, "-")
          .replace(/[^\p{Letter}\p{Number}_-]/gu, "") || "section-" + String(index + 1);
        let candidate = base;
        let suffix = 2;
        while (usedIds.has(candidate)) {
          candidate = base + "-" + String(suffix);
          suffix += 1;
        }
        usedIds.add(candidate);
        return candidate;
      };

      headings.forEach((heading, index) => {
        if (!heading.id) {
          heading.id = createUniqueId(heading, index);
        }
      });

      if (headings.length === 0) {
        outline.replaceChildren();
        const message = document.createElement("p");
        message.className = "outline-status";
        message.textContent = "見出しはありません。";
        outline.appendChild(message);
      } else {
        const rootList = document.createElement("ol");
        const stack = [{ level: 0, list: rootList, item: null }];

        headings.forEach((heading) => {
          const level = Number(heading.tagName.substring(1));

          while (stack.length > 1 && level <= stack[stack.length - 1].level) {
            stack.pop();
          }

          let parent = stack[stack.length - 1];
          if (level > parent.level + 1 && parent.item === null) {
            parent = stack[0];
          }

          const item = document.createElement("li");
          const row = document.createElement("div");
          const spacer = document.createElement("span");
          const link = document.createElement("a");

          row.className = "outline-row";
          spacer.className = "outline-spacer";
          spacer.setAttribute("aria-hidden", "true");
          link.href = "#" + encodeURIComponent(heading.id);
          link.textContent = heading.textContent.trim() || "名称のない見出し";
          link.dataset.targetId = heading.id;

          row.append(spacer, link);
          item.appendChild(row);
          parent.list.appendChild(item);

          const childList = document.createElement("ol");
          childList.hidden = true;
          item.appendChild(childList);
          stack.push({ level, list: childList, item });
        });

        // 子見出しがある項目だけ、折り畳みボタンを設ける。
        rootList.querySelectorAll("li").forEach((item) => {
          const childList = Array.from(item.children).find((child) => child.tagName === "OL");
          const row = item.querySelector(":scope > .outline-row");
          const spacer = row.querySelector(".outline-spacer");

          if (childList && childList.children.length > 0) {
            const toggle = document.createElement("button");
            const label = row.querySelector("a").textContent;
            toggle.type = "button";
            toggle.className = "outline-toggle";
            toggle.setAttribute("aria-expanded", "false");
            toggle.setAttribute("aria-label", label + " の下位見出しを折り畳む");
            toggle.addEventListener("click", () => {
              const expanded = toggle.getAttribute("aria-expanded") === "true";
              toggle.setAttribute("aria-expanded", String(!expanded));
              toggle.setAttribute("aria-label", label + (expanded ? " の下位見出しを展開する" : " の下位見出しを折り畳む"));
              childList.hidden = expanded;
            });
            spacer.replaceWith(toggle);
          } else if (childList) {
            childList.remove();
          }
        });

        outline.replaceChildren(rootList);

        // 現在読んでいる見出しをアウトライン上で強調する。
        const links = Array.from(outline.querySelectorAll("a[data-target-id]"));
        const linkById = new Map(links.map((link) => [link.dataset.targetId, link]));
        const visibleHeadings = new Map();

        const updateCurrent = () => {
          const visible = headings.filter((heading) => visibleHeadings.get(heading.id));
          const current = visible[0] || headings
            .slice()
            .reverse()
            .find((heading) => heading.getBoundingClientRect().top <= 120) || headings[0];

          links.forEach((link) => link.removeAttribute("aria-current"));
          const currentLink = linkById.get(current.id);
          if (currentLink) {
            currentLink.setAttribute("aria-current", "location");
          }
        };

        if ("IntersectionObserver" in window) {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => visibleHeadings.set(entry.target.id, entry.isIntersecting));
            updateCurrent();
          }, { rootMargin: "-10% 0px -75% 0px", threshold: 0 });
          headings.forEach((heading) => observer.observe(heading));
        }
      }

      // 狭い画面ではアウトライン全体を開閉できる。
      mobileButton.addEventListener("click", () => {
        const expanded = mobileButton.getAttribute("aria-expanded") === "true";
        mobileButton.setAttribute("aria-expanded", String(!expanded));
        outline.hidden = expanded;
      });

      outline.addEventListener("click", (event) => {
        if (event.target.closest("a") && window.matchMedia("(max-width: 60rem)").matches) {
          mobileButton.setAttribute("aria-expanded", "false");
          outline.hidden = true;
        }
      });

      window.addEventListener("resize", () => {
        if (!window.matchMedia("(max-width: 60rem)").matches) {
          outline.hidden = false;
          mobileButton.setAttribute("aria-expanded", "true");
        }
      });
    })();
  </script>
</body>
</html>
